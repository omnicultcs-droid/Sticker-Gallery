<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wholesale Order Submitted – OMNI-CULT</title>
  <style>
    :root{--neon:#39ff14;--text:#f5f7f5;--muted:#a4aaa4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(57,255,20,.09),transparent 28rem),#000;color:var(--text);font-family:Arial,Helvetica,sans-serif;text-align:center}
    .page{width:min(820px,94%);padding:24px 0 50px}
    .logo{display:block;width:min(760px,96%);height:auto;margin:0 auto 8px;filter:drop-shadow(0 0 6px rgba(57,255,20,.85)) drop-shadow(0 0 16px rgba(57,255,20,.45))}
    h1{margin:0 0 16px;color:var(--neon);font-size:clamp(28px,5vw,46px);font-weight:1000;letter-spacing:.07em;text-transform:uppercase;text-shadow:0 0 12px rgba(57,255,20,.75)}
    .card{background:linear-gradient(180deg,rgba(10,15,10,.97),rgba(3,7,3,.99));border:1px solid rgba(57,255,20,.35);border-radius:16px;padding:26px 22px;box-shadow:0 0 24px rgba(57,255,20,.09)}
    .check{width:64px;height:64px;margin:0 auto 16px;border:2px solid var(--neon);border-radius:50%;display:grid;place-items:center;color:var(--neon);font-size:34px;font-weight:1000;box-shadow:0 0 18px rgba(57,255,20,.28)}
    .lead{margin:0 0 10px;font-size:1.1rem;font-weight:900}
    p{margin:8px auto;max-width:620px;color:#d7dbd7;line-height:1.55}.muted{color:var(--muted);font-size:.9rem}
    .btn{display:inline-block;margin-top:22px;padding:13px 24px;background:var(--neon);color:#000;border:1px solid var(--neon);border-radius:999px;text-decoration:none;font-weight:1000;letter-spacing:.04em;box-shadow:0 0 14px rgba(57,255,20,.4);transition:.12s ease}
    .btn:hover{filter:brightness(1.08);box-shadow:0 0 20px rgba(57,255,20,.58)}.btn:active{transform:scale(.98)}
  </style>
</head>
<body>
  <main class="page">
    <img src="../Logo.png" class="logo" alt="OMNI-CULT">
    <h1>Order Submitted</h1>
    <div class="card">
      <div class="check">✓</div>
      <p class="lead">Your wholesale sticker order has been submitted successfully.</p>
      <p>We’ll review your selections and send your final invoice soon.</p>
      <a href="index.html" class="btn">RETURN TO WHOLESALE FORM</a>
    </div>
  </main>
</body>
</html>
